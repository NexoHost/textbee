name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set API URL
        run: |
          sed -i 's|https://api.textbee.dev/api/v1/|${{ secrets.API_BASE_URL }}|g' android/app/build.gradle

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleProdRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: textbee-apk
          path: android/app/build/outputs/apk/prod/release/*.apk
